name: Merge/Release Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  release_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

    - name: Build Release APK and AAB
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/cgl-hustle-v*-release.apk
        retention-days: 14

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/cgl-hustle-v*-release.aab
        retention-days: 14

    - name: Cleanup Keystore
      if: always()
      run: rm -f release.jks

    - name: Failure Notification
      if: failure()
      run: |
        echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
        echo "The CGL Hustle release build failed. Please check the logs." >> $GITHUB_STEP_SUMMARY
        echo "Job: ${{ github.job }}" >> $GITHUB_STEP_SUMMARY
        echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

        # Slack/Discord webhook placeholder
        # curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 The CGL Hustle release build failed on main! Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' ${{ secrets.SLACK_WEBHOOK_URL }}

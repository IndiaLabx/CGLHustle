name: Merge/Release Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  release_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # --- TEMPORARILY DISABLED: Preventing Corrupted Keystore Error ---
    # - name: Decode Keystore
    #   env:
    #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    #   run: |
    #     echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

    # Since the keystore file is not generated above, our build.gradle.kts 
    # fallback logic will automatically sign this release build with the debug key!
    - name: Build Release APK and AAB
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*-release*.apk
        retention-days: 14

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*-release*.aab
        retention-days: 14

    - name: Failure Notification
      if: failure()
      run: |
        echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
        echo "The CGL Hustle release build failed. Please check the logs." >> $GITHUB_STEP_SUMMARY
        echo "Job: ${{ github.job }}" >> $GITHUB_STEP_SUMMARY
        echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
